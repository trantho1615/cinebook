spring:
  application:
    name: cinebook-api

  datasource:
    url: jdbc:postgresql://localhost:5432/cinebook
    username: cinebook
    password: cinebook

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
