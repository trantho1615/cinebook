spring:
  application:
    name: cinebook-api

  datasource:
    url: jdbc:postgresql://localhost:5432/cinebook
    username: cinebook
    password: cinebook

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

cinebook:
  jwt:
    # HS256 yeu cau khoa toi thieu 256 bit (32 byte). Gia tri mac dinh chi dung cho
    # may lap trinh vien; moi trien khai that phai dat bien moi truong CINEBOOK_JWT_SECRET.
    secret: ${CINEBOOK_JWT_SECRET:doi-chuoi-nay-truoc-khi-deploy-that-va-dai-toi-thieu-32-byte}
    access-ttl: 15m
    refresh-ttl: 7d

  login:
    max-failures: 5
    lockout-window: 15m

  booking:
    hold-ttl: 10m
    max-seats-per-hold: 8

  payment:
    mock-base-url: https://sandbox.example.com
    webhook-secret: ${CINEBOOK_WEBHOOK_SECRET:doi-chuoi-nay-truoc-khi-deploy-that}
    reconcile-after: 15m

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
