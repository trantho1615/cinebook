spring:
  application:
    name: cinebook-api

  datasource:
    url: jdbc:postgresql://localhost:5432/cinebook
    username: cinebook
    password: cinebook

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

cinebook:
  jwt:
    # KHONG co gia tri mac dinh trong ma nguon.
    #
    # De trong thi SecretResolver sinh mot bi mat ngau nhien cho lan chay nay va canh bao to.
    # Tien khi phat trien, va khong the vo tinh mang ra that vi token khong song qua lan khoi
    # dong sau. Profile prod doi bien nay bat buoc phai co.
    secret: ${CINEBOOK_JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 7d

  login:
    max-failures: 5
    lockout-window: 15m

  booking:
    hold-ttl: 10m
    max-seats-per-hold: 8

  payment:
    mock-base-url: https://sandbox.example.com
    webhook-secret: ${CINEBOOK_WEBHOOK_SECRET:}
    reconcile-after: 15m

server:
  port: 8080

management:
  tracing:
    sampling:
      # 1.0 cho demo: moi request deu co trace. Moi truong that phai ha xuong
      # (0,01-0,1) — luu tram phan tram trace cua mot he thong dong nguoi la tu tao
      # ra mot bai toan luu tru moi.
      probability: 1.0

  opentelemetry:
    resource-attributes:
      service.name: cinebook-api
    tracing:
      export:
        otlp:
          # Ten property nay KHAC Boot 3 (management.otlp.tracing.endpoint). Da tra
          # trong spring-configuration-metadata.json cua
          # spring-boot-micrometer-tracing-opentelemetry chu khong doan theo tai lieu cu.
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

  server:
    # Cong quan tri tach rieng khoi cong nghiep vu (8080).
    #
    # /actuator/prometheus ke ten tung endpoint, so nguoi dung dang hoat dong va nhip giao
    # dich — du de bat ky ai dung lai buc tranh kinh doanh. No thuoc ve mang noi bo. Prometheus
    # scrape cong nay; ngoai Internet chi thay 8080.
    port: 8090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

  metrics:
    distribution:
      # Mac dinh Boot chi xuat count/sum/max cho http.server.requests, khong du de tinh
      # phan vi. Bat histogram de so sanh do tre PHIA SERVER voi do tre k6 do o phia
      # client — chenh lech giua hai con so la thoi gian xep hang truoc khi vao handler.
      #
      # Khoa map co dau cham PHAI boc ngoac vuong. Viet http.server.requests: true thi
      # Spring tach theo dau cham thanh map long nhau va cau hinh im lang khong co tac
      # dung nao.
      percentiles-histogram:
        "[http.server.requests]": true

