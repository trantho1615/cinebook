# Ban prod: ung dung chay TRONG compose nen scrape theo ten service, khong phai
# host.docker.internal nhu ban chay tren may ca nhan.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: cinebook-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api:8090']
        labels:
          deployable: api

  - job_name: cinebook-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['worker:8091']
        labels:
          deployable: worker
